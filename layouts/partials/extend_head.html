{{- /* 90s retro top banner — marquee + under-construction. Injected at the
       very top of <body> on load so it pushes content down naturally.

{{ `document.addEventListener('DOMContentLoaded', function () {
  if (document.getElementById('retro-topbar')) return;

  bar.innerHTML =
    '<marquee scrollamount="6" behavior="scroll" direction="left">' +
      '<span class="hot">★★★</span> WELCOME TO AGUNG&#39;S CORNER OF THE WEB! ' +
      '<span class="cold">Best viewed in Netscape Navigator 4.0 at 1024×768</span> ' +

    '<\/marquee>' +
    '<div class="retro-construction"><span>🚧 This site is UNDER CONSTRUCTION — pardon our dust! 🚧<\/span><\/div>';
