baseURL = "https://agungsukariman.com/"
languageCode = "EN"
title = "Agung Sukariman | Digital Marketer & Tech Tinkerer"
theme = "PaperMod"
pagination.pagerSize = 10
enableRobotsTXT = true
canonifyURLs = true

[params]
  author = "Agung Sukariman"
  description = "Digital marketing specialist sharing stories about cycling, tech DIY, and personal growth. Based in Jakarta."
  ShowReadingTime = true
  ShowShareButtons = true
  ShowCodeCopyButtons = true
  ShowToc = false
  TocOpen = false
  defaultTheme = "auto" #light/dark/auto
  disableThemeToggle = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShareButtons = ["linkedin", "twitter", "whatsapp", "facebook"]

[params.homeInfoParams]
  Title = "Welcome to My Corner"
  Content = "Stories about cycling, tech tinkering, and figuring life out as I go."

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Services"
  url = "/services/"
  weight = 2

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 3

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 4

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 5


[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params.assets]
  disableFingerprinting = false

[markup]
  enableExtendedSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
